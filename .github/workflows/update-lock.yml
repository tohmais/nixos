name: update-pins
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update pins
        run: nix run --accept-flake-config github:manic-systems/tack -- update

      - name: Evaluate hosts
        run: |
          for h in phos homesick raiden; do
            echo "::group::$h"
            nix-instantiate entry.nix -A nixosConfigurations.$h.config.system.build.toplevel
            echo "::endgroup::"
          done

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-pins
          title: "Update tack pins"
          commit-message: "chore: tack pins update"
          assignees: tohmais
          reviewers: tohmais
          labels: |
            dependencies
            automated
